name: Site check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 15 * * 1"   # Mondays 15:17 UTC = 8:17 am Pacific: catches dates that went stale over the weekend
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_site.py
